name: CI NovaCorp API

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: novacorp-api

jobs:
  validate:
    name: 1 - Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint du Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < app/Dockerfile

      - name: Syntaxe Python
        run: python3 -m py_compile app/main.py

      - name: Dependances epinglees
        run: |
          if grep -vE '^\s*(#|$)' app/requirements.txt | grep -vq '=='; then
            echo "Dependance non epinglee dans requirements.txt"; exit 1
          fi

  build:
    name: 2 - Build, test et scan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image (cache GitHub Actions)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de fumee
        run: |
          docker run -d --name smoke -p 8000:8000 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/
          docker rm -f smoke

      - name: Scan Trivy (rapport HIGH/CRITICAL)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:latest image --no-progress --scanners vuln --severity HIGH,CRITICAL ${{ env.IMAGE_NAME }}:ci

      - name: Scan Trivy (bloquant sur CRITICAL)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:latest image --no-progress --scanners vuln --severity CRITICAL --exit-code 1 ${{ env.IMAGE_NAME }}:ci

  publish:
    name: 3 - Publication GHCR
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tags automatiques
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
